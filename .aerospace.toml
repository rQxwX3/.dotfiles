after-startup-command = [
	'exec-and-forget sketchybar',
  	'exec-and-forget borders active_color=0x00000000 inactive_color=0xff000000 width=3 order=above'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
	'sketchybar --trigger aerospace_workspace_change'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     -1
    outer.top =        0
    outer.right =      0

# This mode is for Mac keyboard usage. Hitting alt as well as other mods proved to be harmful to wrists.
[mode.wm.binding]
	esc = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']

	a = ['exec-and-forget open -a "Arc"', 'workspace A', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']	
	d = ['workspace D', 'mode main']
    f = ['exec-and-forget open -a "Finder"', 'workspace F', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 
    m = ['exec-and-forget open -a "Messages"', 'workspace M', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 
    s = ['exec-and-forget open -a "Settings"', 'workspace S', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 
    t = ['exec-and-forget open -a "Telegram"', 'workspace T', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 
    v = ['exec-and-forget open -a "Streisand"', 'workspace V', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 
    w = ['exec-and-forget open -a "Wezterm"', 'workspace W', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 
    p = ['exec-and-forget open -a "Sioyek"', 'workspace P', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main'] 

    shift-a = ['move-node-to-workspace A', 'workspace A', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-d = ['move-node-to-workspace D', 'workspace D', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-f = ['move-node-to-workspace F', 'workspace F', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-m = ['move-node-to-workspace M', 'workspace M', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-s = ['move-node-to-workspace S', 'workspace S', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-t = ['move-node-to-workspace T', 'workspace T', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-v = ['move-node-to-workspace V', 'workspace V', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-w = ['move-node-to-workspace W', 'workspace W', 'focus left', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']
    shift-p = ['move-node-to-workspace P', 'workspace P', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode MODE=main']

	l = ['focus right' ]
	h = ['focus left' ]
	j = ['focus down']
	k = ['focus up']

[mode.main.binding]
	shift-esc = ['mode wm','exec-and-forget sketchybar --trigger aerospace_mode MODE=wm' ]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

	alt-a = ['exec-and-forget open -a "Arc"', 'workspace A',]	
	alt-d = ['workspace D']
    alt-f = ['exec-and-forget open -a "Finder"', 'workspace F'] 
    alt-m = ['exec-and-forget open -a "Messages"', 'workspace M'] 
    alt-s = ['exec-and-forget open -a "Settings"', 'workspace S'] 
    alt-t = ['exec-and-forget open -a "Telegram"', 'workspace T'] 
    alt-v = ['exec-and-forget open -a "Streisand"', 'workspace V'] 
    alt-w = ['exec-and-forget open -a "Wezterm"', 'workspace W'] 
    alt-p = ['exec-and-forget open -a "Sioyek"', 'workspace P'] 

    alt-shift-a = ['move-node-to-workspace A', 'workspace A']
    alt-shift-d = ['move-node-to-workspace D', 'workspace D']
    alt-shift-f = ['move-node-to-workspace F', 'workspace F']
    alt-shift-m = ['move-node-to-workspace M', 'workspace M']
    alt-shift-s = ['move-node-to-workspace S', 'workspace S']
    alt-shift-t = ['move-node-to-workspace T', 'workspace T']
    alt-shift-v = ['move-node-to-workspace V', 'workspace V']
    alt-shift-w = ['move-node-to-workspace W', 'workspace W', 'focus left']
    alt-shift-p = ['move-node-to-workspace P', 'workspace P']

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-tab = 'workspace-back-and-forth'

    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
